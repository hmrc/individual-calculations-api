summary: Retrieve a Self Assessment Tax Liability Summary
description: |
  This endpoint enables you to retrieve a summary of the tax liability for a given National Insurance number, tax year and calculation ID, mapped to the line entries of an SA302 tax calculation.

  It is only available for intent-to-finalise, declare-finalisation, intent-to-amend and confirm-amendment calculations. The summary of an intent-to-finalise or intent-to-amend calculation cannot be used as mortgage evidence.

  **This endpoint can only be used for tax years from 2026-27 onwards.**

  ### Test data
  Scenario simulations using Gov-Test-Scenario headers is only available in the sandbox environment.

  | Header Value (Gov-Test-Scenario) | Scenario                                                                                                 |
  |----------------------------------|----------------------------------------------------------------------------------------------------------|
  | N/A - DEFAULT                    | Simulates success response.                                                                              |
  | NOT_FOUND                        | Simulates the scenario where no data is found.                                                           |
  | CALCULATION_TYPE_NOT_SUPPORTED   | Simulates the scenario where the supplied calculation ID is for a calculation type that is not supported. |

tags:
  - Tax Calculations

parameters:
  - $ref: ./common/pathParameters.yaml#/components/parameters/nino
  - $ref: ./common/pathParameters.yaml#/components/parameters/taxYearMinimum2027
  - $ref: ./common/pathParameters.yaml#/components/parameters/calculationId
  - $ref: ./common/headers.yaml#/components/parameters/acceptJson
  - $ref: ./common/headers.yaml#/components/parameters/authorizationReadScopeHeader
  - $ref: ./common/headers.yaml#/components/parameters/testScenarioHeader

security:
  - User-Restricted:
      - read:self-assessment

responses:
  200:
    description: Success
    headers:
      X-CorrelationId:
        $ref: ./common/headers.yaml#/components/parameters/correlationId
      Deprecation:
        $ref: ./common/headers.yaml#/components/parameters/deprecationHeader
      Sunset:
        $ref: ./common/headers.yaml#/components/parameters/sunsetHeader
      Link:
        $ref: ./common/headers.yaml#/components/parameters/linkHeader
    content:
      application/json:
        schema:
          $ref: ./schemas/tax_liability_summary_retrieve/tax_liability_summary_retrieve_response.json
        examples:
          "Example response for TY 2026-27 onwards":
            value:
              $ref: ./examples/tax_liability_summary_retrieve/tax_liability_summary_retrieve_response.json

  400:
    description: Bad request
    headers:
      X-CorrelationId:
        $ref: ./common/headers.yaml#/components/parameters/correlationId
      Deprecation:
        $ref: ./common/headers.yaml#/components/parameters/deprecationHeader
      Sunset:
        $ref: ./common/headers.yaml#/components/parameters/sunsetHeader
      Link:
        $ref: ./common/headers.yaml#/components/parameters/linkHeader
    content:
      application/json:
        schema:
          $ref: ./schemas/error-response.yaml
        examples:
          FORMAT_NINO:
            $ref: ./common/errors.yaml#/components/examples/formatNino
          FORMAT_TAX_YEAR:
            $ref: ./common/errors.yaml#/components/examples/formatTaxYear
          FORMAT_CALCULATION_ID:
            $ref: ./common/errors.yaml#/components/examples/formatCalculationId
          RULE_TAX_YEAR_RANGE_INVALID:
            $ref: ./common/errors.yaml#/components/examples/ruleTaxYearRangeInvalid
          RULE_TAX_YEAR_NOT_SUPPORTED:
            $ref: ./common/errors.yaml#/components/examples/ruleTaxYearNotSupported
          RULE_CALCULATION_TYPE_NOT_SUPPORTED:
            $ref: ./common/errors.yaml#/components/examples/ruleCalculationTypeNotSupported
          RULE_INCORRECT_GOV_TEST_SCENARIO:
            $ref: ./common/errors.yaml#/components/examples/ruleIncorrectGTS

  403:
    description: Forbidden
    headers:
      X-CorrelationId:
        $ref: ./common/headers.yaml#/components/parameters/correlationId
      Deprecation:
        $ref: ./common/headers.yaml#/components/parameters/deprecationHeader
      Sunset:
        $ref: ./common/headers.yaml#/components/parameters/sunsetHeader
      Link:
        $ref: ./common/headers.yaml#/components/parameters/linkHeader
    content:
      application/json:
        schema:
          $ref: ./schemas/error-response.yaml
        examples:
          CLIENT_OR_AGENT_NOT_AUTHORISED:
            $ref: ./common/errors.yaml#/components/examples/clientOrAgentNotAuthorised

  404:
    description: Not Found
    headers:
      X-CorrelationId:
        $ref: ./common/headers.yaml#/components/parameters/correlationId
      Deprecation:
        $ref: ./common/headers.yaml#/components/parameters/deprecationHeader
      Sunset:
        $ref: ./common/headers.yaml#/components/parameters/sunsetHeader
      Link:
        $ref: ./common/headers.yaml#/components/parameters/linkHeader
    content:
      application/json:
        schema:
          $ref: ./schemas/error-response.yaml
        examples:
          MATCHING_RESOURCE_NOT_FOUND:
            $ref: ./common/errors.yaml#/components/examples/notFoundNoId
