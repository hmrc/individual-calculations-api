summary: Create or Amend Provisional Figures Information
description: |
  This endpoint is used to create or amend provisional figures information to confirm whether provisional figures are included in a tax return and, where applicable, to provide the reason for using them and the expected date when final figures will be available. A National Insurance number and tax year are required. This endpoint can only be used after the tax year has ended.
  
  ### Test data
  Scenario simulation using Gov-Test-Scenario headers is only available in the sandbox environment.
  | Header Value (Gov-Test-Scenario)      | Scenario                                                                                        |
  |---------------------------------------|-------------------------------------------------------------------------------------------------|
  | N/A - DEFAULT                         | Simulates success response.                                                                     |
  | NOT_FOUND                             | Simulates the scenario where no data is found.                                                  |
  | OUTSIDE_AMENDMENT_WINDOW              | Simulates the scenario where request cannot be completed as it is outside the amendment window.	|
  | STATEFUL                              | Performs a stateful create or update.                                                           |
  

tags:
  - Provisional Figures Information

parameters:
  - $ref: "./common/pathParameters.yaml#/components/parameters/nino"
  - $ref: "./common/pathParameters.yaml#/components/parameters/taxYearMinimum2027"
  - $ref: "./common/headers.yaml#/components/parameters/acceptJson"
  - $ref: "./common/headers.yaml#/components/parameters/authorizationWriteScopeHeader"
  - $ref: "./common/headers.yaml#/components/parameters/testScenarioHeader"
  - $ref: "./common/headers.yaml#/components/parameters/suspendTemporalValidationsHeader"

security:
  - User-Restricted:
      - write:self-assessment

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "./schemas/provisional_figures_information_create_amend/provisional_figures_information_create_amend_request.json"
      example:
        $ref: "./examples/provisional_figures_information_create_amend/provisional_figures_information_create_amend_request.json"
responses:
  204:
    description: Success (No Content)
    headers:
      X-CorrelationId:
        $ref: "./common/headers.yaml#/components/parameters/correlationId"
      Deprecation:
        $ref: "./common/headers.yaml#/components/parameters/deprecationHeader"
      Sunset:
        $ref: "./common/headers.yaml#/components/parameters/sunsetHeader"
      Link:
        $ref: "./common/headers.yaml#/components/parameters/linkHeader"

  400:
    description: Bad request
    headers:
      X-CorrelationId:
        $ref: "./common/headers.yaml#/components/parameters/correlationId"
      Deprecation:
        $ref: "./common/headers.yaml#/components/parameters/deprecationHeader"
      Sunset:
        $ref: "./common/headers.yaml#/components/parameters/sunsetHeader"
      Link:
        $ref: "./common/headers.yaml#/components/parameters/linkHeader"
    content:
      application/json:
        schema:
          $ref: "./schemas/error-response.yaml"
        examples:
          FORMAT_NINO:
            $ref: "./common/errors.yaml#/components/examples/formatNino"
          FORMAT_TAX_YEAR:
            $ref: "./common/errors.yaml#/components/examples/formatTaxYear"
          RULE_TAX_YEAR_RANGE_INVALID:
            $ref: "./common/errors.yaml#/components/examples/ruleTaxYearRangeInvalid"
          RULE_TAX_YEAR_NOT_SUPPORTED:
            $ref: "./common/errors.yaml#/components/examples/ruleTaxYearNotSupported"
          RULE_TAX_YEAR_NOT_ENDED:
            $ref: "./common/errors.yaml#/components/examples/ruleTaxYearNotEnded"
          FORMAT_EXPECTED_DATE:
            $ref: "./common/errors.yaml#/components/examples/formatExpectedDate"
          FORMAT_SUPPLEMENTARY_INFORMATION:
            $ref: "./common/errors.yaml#/components/examples/formatSupplementaryInformation"
          RULE_INCORRECT_OR_EMPTY_BODY_SUBMITTED:
            $ref: "./common/errors.yaml#/components/examples/ruleIncorrectOrEmptyBodySubmitted"
          RULE_PROVISIONAL_FIGURES_INDICATOR_INVALID:
            $ref: "./common/errors.yaml#/components/examples/ruleProvisionalFiguresIndicatorInvalid"
          RULE_EXPECTED_DATE_NOT_IN_FUTURE:
            $ref: "./common/errors.yaml#/components/examples/ruleExpectedDateNotInFuture"
          RULE_OUTSIDE_AMENDMENT_WINDOW:
            $ref: "./common/errors.yaml#/components/examples/ruleOutsideAmendmentWindow"
          RULE_INCORRECT_GOV_TEST_SCENARIO:
            $ref: "./common/errors.yaml#/components/examples/ruleIncorrectGTS"

  403:
    description: Forbidden
    headers:
      X-CorrelationId:
        $ref: "./common/headers.yaml#/components/parameters/correlationId"
      Deprecation:
        $ref: "./common/headers.yaml#/components/parameters/deprecationHeader"
      Sunset:
        $ref: "./common/headers.yaml#/components/parameters/sunsetHeader"
      Link:
        $ref: "./common/headers.yaml#/components/parameters/linkHeader"
    content:
      application/json:
        schema:
          $ref: "./schemas/error-response.yaml"
        examples:
          CLIENT_OR_AGENT_NOT_AUTHORISED:
            $ref: "./common/errors.yaml#/components/examples/clientOrAgentNotAuthorised"
